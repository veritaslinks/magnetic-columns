<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magnetic Columns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#EEF1F4;--panel:#F8FAFC;--ink:#1B2430;--muted:#5B6B7F;--line:#D3DAE2;--field:#5B4FCF;--pos:#12866B;--neg:#CF5A33;--amber:#B87A10;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#11151B;--panel:#171C24;--ink:#E4E9F0;--muted:#8D9AAB;--line:#2A323D;--field:#A79FF2;--pos:#3FBF98;--neg:#F08A63;--amber:#E8B04A}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11151B;--panel:#171C24;--ink:#E4E9F0;--muted:#8D9AAB;--line:#2A323D;--field:#A79FF2;--pos:#3FBF98;--neg:#F08A63;--amber:#E8B04A}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-0.01em}
.hdr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0}
#v3{flex:1;min-height:280px;position:relative;cursor:grab;touch-action:none;overflow:hidden}
#v3 canvas{display:block;position:absolute;left:0;top:0}
.evt{position:absolute;left:12px;top:10px;max-width:72%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:13px;line-height:1.45;opacity:0;transition:opacity .4s;pointer-events:none;z-index:2}
.hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:var(--muted);pointer-events:none;max-width:90%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);padding:6px 16px;border-top:1px solid var(--line)}
.legend .d{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend .q{display:inline-block;width:9px;height:9px;transform:rotate(45deg);margin-right:6px;vertical-align:0}
.legend .s{display:inline-block;width:14px;height:10px;vertical-align:-1px}
.scopewrap{padding:4px 16px 12px;border-top:1px solid var(--line)}
.metrics{display:flex;gap:24px;padding:6px 0 4px;flex-wrap:wrap}
.metric b{display:block;font-size:20px;font-weight:500;line-height:1.2}
.metric span{font-size:12px;color:var(--muted)}
#scope{flex:1;min-width:0;width:100%;height:170px;display:block}
.viz{display:flex;gap:14px;align-items:flex-start}
.mapbox{flex:0 0 220px}
.maphead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.maphead button{padding:2px 8px;font-size:12px}
#map{width:220px;height:170px;display:block;border:1px solid var(--line);border-radius:6px}
.bar{height:8px;width:160px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--field)}
aside{border-left:1px solid var(--line);overflow-y:auto;background:var(--panel);padding:2px 16px 28px}
details{border-bottom:1px solid var(--line);padding:4px 0 8px}
summary{cursor:pointer;font-weight:600;font-size:14px;padding:8px 0}
.row{display:grid;grid-template-columns:148px minmax(0,1fr) 48px;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.row label{color:var(--muted);line-height:1.3}
.row output{text-align:right;font-weight:500}
.row select{grid-column:2/4;width:100%}
button,select{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
select{background-color:var(--panel);color:var(--ink)}
select option{background-color:var(--panel);color:var(--ink)}
button.primary{background:var(--field);color:var(--bg);border-color:var(--field)}
:focus-visible{outline:2px solid var(--field);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--field)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.note{font-size:12.5px;color:var(--muted);line-height:1.55;margin:6px 0 8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--field);color:var(--bg)}
.status{font-size:13px;line-height:1.5;margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:min(720px,100%);max-height:90%;display:flex;flex-direction:column;padding:14px 16px;gap:6px}
.mhead{display:flex;justify-content:space-between;align-items:center}
#mText{width:100%;min-height:320px;flex:1;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.chk input{accent-color:var(--field)}
@media (max-width:720px){
.viz{flex-direction:column}
.mapbox{flex:none}

.app{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto}
#v3{height:440px;flex:none}
aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
}
</style>
</head>
<body>
<div class="app">
<header>
<h1>Magnetic Columns</h1>
<div class="hdr">
<div class="seg" role="group" aria-label="Mode"><button data-mode="free" aria-pressed="true">Free dynamics</button><button data-mode="res" aria-pressed="false">Reservoir computing</button><button data-mode="mem" aria-pressed="false">Associative memory</button></div>
<button id="kc" class="primary">Impulse to the centre</button>
<button id="ke">Impulse to the edge</button>
<button id="play">Pause</button>
<button id="exp">Export settings</button>
<button id="imp">Import settings</button>
</div>
</header>
<section class="stage">
<div id="v3"><div class="evt" id="evt"></div><div class="hint">Drag: rotate. Wheel or pinch: zoom. Click an element: inspect or flash (chosen in “Display”).</div></div>
<div class="legend" id="legend"></div>
<div class="scopewrap"><div class="metrics" id="metrics"></div><div class="viz"><div class="mapbox"><div class="maphead"><span id="mapTitle">Top map</span><button id="mapView">Side view</button></div><canvas id="map"></canvas></div><canvas id="scope"></canvas></div></div>
</section>
<aside>
<details open><summary id="taskTitle">Mode</summary><div id="taskPanel"></div></details>
<details open><summary>Signal and flashes</summary><div id="sigPanel"></div></details>
<details open><summary>Links through the corner channels</summary><div id="lnkPanel"></div></details>
<details open><summary>Cooling</summary><div id="colPanel"></div></details>
<details><summary>Dynamics inside cells</summary><div id="dynPanel"></div></details>
<details><summary>Construction</summary><div id="conPanel"></div></details>
<details><summary>Display</summary><div id="disPanel"></div></details>
</aside>
</div>
<div class="modal" id="modal" hidden><div class="mbox"><div class="mhead"><b id="mTitle">Settings</b><button id="mClose">Close</button></div><div class="note" id="mNote"></div><textarea id="mText" spellcheck="false"></textarea><div class="btns" id="mBtns"></div><div class="note" id="mMsg"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const mq=window.matchMedia('(prefers-color-scheme: dark)');
let dark=false;
const fLo=new THREE.Color(),fHi=new THREE.Color(),inkC=new THREE.Color(),pilC=new THREE.Color(),pos=new THREE.Color(),neg=new THREE.Color(),neu=new THREE.Color(),amb=new THREE.Color(),lnkLo=new THREE.Color(),lnkHi=new THREE.Color();
let HEX=[],HR=[];
function readColors(){const a=document.documentElement.dataset.theme;dark=a?a==='dark':mq.matches;
inkC.set(css('--muted')||'#5B6B7F');pilC.set(css('--field')||'#5B4FCF');pos.set(css('--pos')||'#12866B');neg.set(css('--neg')||'#CF5A33');amb.set(css('--amber')||'#B87A10');
neu.set(dark?'#3A4250':'#C3CBD5');fLo.set(dark?'#3C3489':'#B9B3EE');fHi.set(dark?'#EEEDFE':'#2A2270');lnkLo.set(dark?'#252C37':'#DCE2E9');lnkHi.set(css('--field')||'#5B4FCF');
HEX=dark?['#3B4C8C','#7F77DD','#D4537E','#F0997B','#FAC775']:['#9DB8D6','#7F77DD','#D4537E','#E24B4A','#A32D2D'];HR=HEX.map(c=>new THREE.Color(c))}
readColors();

const stage=$('v3');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
const PR=Math.min(1.5,window.devicePixelRatio||1);renderer.setPixelRatio(PR);stage.appendChild(renderer.domElement);

const cloudMat=new THREE.ShaderMaterial({uniforms:{sc:{value:500}},
vertexShader:'attribute float size;attribute float alpha;attribute vec3 col;varying vec3 vC;varying float vA;uniform float sc;void main(){vC=col;vA=alpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=alpha<0.01?0.0:min(size*sc/-mv.z,64.0);gl_Position=projectionMatrix*mv;}',
fragmentShader:'varying vec3 vC;varying float vA;void main(){vec2 c=gl_PointCoord-0.5;float d=length(c);if(d>0.5)discard;float f=1.0-smoothstep(0.0,0.5,d);gl_FragColor=vec4(vC,vA*f*f);}',transparent:true,depthWrite:false});
let lastW=0,lastH=0;function resize(){const w=Math.round(stage.clientWidth||600),h=Math.round(stage.clientHeight||400);if(Math.abs(w-lastW)>1||Math.abs(h-lastH)>1){lastW=w;lastH=h;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();cloudMat.uniforms.sc.value=h*PR/(2*Math.tan(19*Math.PI/180))}
const sc=$('scope'),r=sc.getBoundingClientRect();sc.width=Math.max(100,r.width*PR);sc.height=170*PR;const mp=$('map');mp.width=220*PR;mp.height=170*PR}
new ResizeObserver(resize).observe(stage);window.addEventListener('resize',resize);
let th=0.6,ph=0.9,dist=10,auto=false;
function placeCam(){cam.position.set(dist*Math.sin(ph)*Math.cos(th),dist*Math.cos(ph),dist*Math.sin(ph)*Math.sin(th));cam.lookAt(0,0,0)}

const S3=Math.sqrt(3);

let gain=1.2,noise=0.03,D=2,curie=0.5,adapt=0.8,heat=1,tflip=true,relax=0.2;
let logicOn=true,linkSig='change',linkMode='exc',linkGain=1.5,linkDelay=3,jGain=0.7;
let coolCorner=1.5,coreOn=true,coreCool=1.5,coolEdge=0.6,logicHeat=1,thermo=false,tth=3;
let inMode='none',inAmp=1.5,inFreq=0.03;
let showG=true,showLk=true,showN=true,showC=true,showCells=true,showF=true,fSlice=-1,run=true;
let mode='free',task='delay',kh=5,inScale=1.2,readFrom='all',spf=3,u1=0,u2=0,yT=0,evalOn=true,J3=null,Win1=null,Win2=null,isIn=null;
let beta=3,damage=0.3,cue='layers',memW=null,stored=[],ovHist=[],selF=-1;
let arch='base',EM=null,SS=null,CTLS=null,CTLI=null,CTLW=null,memC=null,memB=null;
let hlT=0,hlWhat='',evtTimer=null,clickMode='inspect',selG=-1,selIn=null,selOut=null,memJob=null,progUpd=null,progOk=null;
let LA=null,learnMax=0.05,longA=null,longQ=null;
let genColor='activity',trail=null,trailRef=0.2,wImp=null,mapView='top',hth=0.06,learnHist=[];
let fPts=null,fS=null,fI=null,fK=null,fMesh=null,fRef=20,fRefC=5,fMode='cell',fGrp=null,fGroups=[];
const TREF=4,KDEP=3;let KD=KDEP;

function inHex(x,z){const ax=Math.abs(x),az=Math.abs(z);return az<=S3/2&&S3*ax+az<=S3}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function randn(){return Math.sqrt(-2*Math.log(Math.random()+1e-9))*Math.cos(2*Math.PI*Math.random())}
const yOf=l=>(l-(L-1)/2)*dz;

let cells=[],C=0,Pc=12,N=0,nb=[],center=0,edgeCells=[];
let gx,gy,gz,gnx,gnz,gmx,gmy,gmz,gc,gl,gcen,gang,s,ad,Tg,linkU,Wp,dAct,srcI,srcS,Jc;const RCUT2=1.6*1.6,HL=13;
let effRing=[],sRing=[],ringPos=0,ringLen=0,Tbuf=null,calmT=0;const ndCs=new Float32Array(8),ndCn=new Float32Array(8);
let junc=[],nodes=[],links=[],linkOut,nodeVal,nodePrev;
let flashes=[],flAmp=3,flSig=0.8,flH=0.5,flT=12,flashMeshes=[],pulse=[],tStep=0,cellAct=[],ringHist=[],logicQ=0,genQ=0,logicShare=0;
let gapV=new Uint8Array(0),gapK=0.3,NB6=new Int32Array(0),cFl=new Uint8Array(0),kFl=new Uint8Array(0),extU=new Float32Array(0),GXn=1,GZn=1,GY=1,GH=0.12,X0=0,Z0=0,FY=1,Tv,Tn,inV,cornerV,coreV,vIdx=[],gvox,nodeVox;

function localGens(){const out=[];for(let k=0;k<6;k++){const a0=k*Math.PI/3,a1=(k+1)*Math.PI/3,v0=[Math.cos(a0),Math.sin(a0)],v1=[Math.cos(a1),Math.sin(a1)];
const mx=(v0[0]+v1[0])/2,mz=(v0[1]+v1[1])/2,ml=Math.hypot(mx,mz);
for(const t of[1/3,2/3]){const x=v0[0]+(v1[0]-v0[0])*t,z=v0[1]+(v1[1]-v0[1])*t;out.push({x,z,nx:-mx/ml,nz:-mz/ml,c:0,ang:Math.atan2(z,x)})}}
if(pillar)for(let k=0;k<6;k++){const a0=k*Math.PI/3,a1=(k+1)*Math.PI/3,mx=rc*(Math.cos(a0)+Math.cos(a1))/2,mz=rc*(Math.sin(a0)+Math.sin(a1))/2,ml=Math.hypot(mx,mz);
out.push({x:mx,z:mz,nx:mx/ml,nz:mz/ml,c:1,ang:Math.atan2(mz,mx)})}return out}
function bzReal(dx,dy,dz){const T=FTAB[dotType],n=T.n,rho=Math.hypot(dx,dy)*UNIT_NM,z=Math.abs(dz)*UNIT_NM;
if(rho<(n-1)*3&&z<(n-1)*3){const fr=rho/3,fz=z/3,r0=Math.floor(fr),z0=Math.floor(fz),tr=fr-r0,tz=fz-z0,b=T.b,at=(zi,ri)=>b[zi*n+ri];
return(1-tz)*((1-tr)*at(z0,r0)+tr*at(z0,r0+1))+tz*((1-tr)*at(z0+1,r0)+tr*at(z0+1,r0+1))}
const rr=Math.hypot(rho,z)*1e-9,c2=(z*1e-9)*(z*1e-9)/(rr*rr);return 1e-7*T.m*(3*c2-1)/(rr*rr*rr)*1e3}
function unitMT(){return 1e-7*FTAB[dotType].m/Math.pow(UNIT_NM*1e-9,3)*1e3}
function computeJ(){if(!srcI)return;Jc=new Float32Array(srcI.length);J3=new Float32Array(srcI.length*3);const cal=calib&&ori==='axial',K=cal?unitMT()*30/Bsens:1;
for(let a=0;a<N;a++){const px=gx[a]+0.05*gnx[a],py=gy[a],pz=gz[a]+0.05*gnz[a];
for(let k=srcS[a],ke=srcS[a+1];k<ke;k++){const b=srcI[k],rx=px-gx[b],ry=py-gy[b],rz=pz-gz[b],r2=rx*rx+ry*ry+rz*rz;if(r2<2e-3)continue;
const r3=r2*Math.sqrt(r2),mbr=gmx[b]*rx+gmy[b]*ry+gmz[b]*rz,fx=(3*mbr*rx/r2-gmx[b])/r3,fy=(3*mbr*ry/r2-gmy[b])/r3,fz=(3*mbr*rz/r2-gmz[b])/r3;

else{J3[k*3]=fx;J3[k*3+1]=fy;J3[k*3+2]=fz;Jc[k]=fx*gmx[a]+fy*gmy[a]+fz*gmz[a]}}}}
function setOri(){for(let a=0;a<N;a++){if(ori==='axial'){gmx[a]=0;gmy[a]=1;gmz[a]=0}else if(ori==='radial'){gmx[a]=gnx[a];gmy[a]=0;gmz[a]=gnz[a]}else{gmx[a]=-gnz[a];gmy[a]=0;gmz[a]=gnx[a]}}}

function buildGeometry(){const Sp=S3+gap,Rj=1+gap/S3;cells=[];
for(let q=-rings;q<=rings;q++)for(let r=-rings;r<=rings;r++){const d=Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r));if(d>rings)continue;
cells.push({x:q*Sp*S3/2,z:q*Sp*0.5+r*Sp,ring:d});if(q===0&&r===0)center=cells.length-1}
C=cells.length;edgeCells=cells.map((c,i)=>c.ring===rings?i:-1).filter(i=>i>=0);
const LG=localGens();Pc=LG.length;N=C*L*Pc;
gx=new Float32Array(N);gy=new Float32Array(N);gz=new Float32Array(N);gnx=new Float32Array(N);gnz=new Float32Array(N);gmx=new Float32Array(N);gmy=new Float32Array(N);gmz=new Float32Array(N);
gc=new Int32Array(N);gl=new Int32Array(N);gcen=new Uint8Array(N);gang=new Float32Array(N);
s=new Float32Array(N);ad=new Float32Array(N);trail=new Float32Array(N);wImp=null;Tg=new Float32Array(N);linkU=new Float32Array(N);Wp=new Float32Array(N);dAct=new Float32Array(N);Win1=new Float32Array(N);Win2=new Float32Array(N);isIn=new Uint8Array(N);
const wr=rng(5);
for(let c=0;c<C;c++)for(let l=0;l<L;l++)for(let i=0;i<Pc;i++){const a=(c*L+l)*Pc+i,g=LG[i];gx[a]=cells[c].x+g.x;gz[a]=cells[c].z+g.z;gy[a]=yOf(l);gnx[a]=g.nx;gnz[a]=g.nz;
gc[a]=c;gl[a]=l;gcen[a]=g.c;gang[a]=g.ang;s[a]=Math.random()*2-1;Wp[a]=wr()<0.5?-1:1;Win1[a]=(wr()<0.5?-1:1)*(0.5+0.5*wr());Win2[a]=(wr()<0.5?-1:1)*(0.5+0.5*wr());isIn[a]=(c===center&&l<2&&!g.c)?1:0}
setOri();
nb=cells.map(c0=>cells.map((c1,j)=>Math.hypot(c0.x-c1.x,c0.z-c1.z)<=Sp*1.01?j:-1).filter(j=>j>=0));
const tmpS=[];srcS=new Int32Array(N+1);for(let a=0;a<N;a++){srcS[a]=tmpS.length;for(const cc of nb[gc[a]]){const b0=cc*L*Pc,b1=b0+L*Pc;for(let b=b0;b<b1;b++){if(b===a)continue;const dx=gx[a]-gx[b],dy=gy[a]-gy[b],dz2=gz[a]-gz[b];if(dx*dx+dy*dy+dz2*dz2<=RCUT2)tmpS.push(b)}}}srcS[N]=tmpS.length;srcI=Int32Array.from(tmpS);computeJ();
const map=new Map();cells.forEach((c,ci)=>{for(let k=0;k<6;k++){const a=k*Math.PI/3,px=c.x+Rj*Math.cos(a),pz=c.z+Rj*Math.sin(a),key=Math.round(px*1000)+','+Math.round(pz*1000);
if(!map.has(key))map.set(key,{x:px,z:pz,ent:[]});map.get(key).ent.push({c:ci,k})}});
junc=[...map.values()].filter(j=>j.ent.length>=2);
const sr=rng(9);nodes=[];links=[];
junc.forEach((j,ji)=>{for(let l=0;l<L;l++){const nd={j:ji,l,lk:[],nc:j.ent.length};
j.ent.forEach((e,cp)=>{for(const li of[2*e.k,(2*e.k+11)%12]){const a=(e.c*L+l)*Pc+li;const sg=linkMode==='exc'?1:linkMode==='inh'?-1:(sr()<0.5?-1:1);nd.lk.push(links.length);links.push({a,cp,sg,node:nodes.length})}});

const ray=new THREE.Raycaster(),mv=new THREE.Vector2();

const r=el.getBoundingClientRect();mv.x=((e.clientX-r.left)/r.width)*2-1;mv.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mv,cam);

const dg=hg.length&&hg[0].instanceId!==undefined?hg[0].distance:Infinity,df=hf.length&&hf[0].instanceId!==undefined?hf[0].distance:Infinity;

el.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pd=0});
mq.addEventListener&&mq.addEventListener('change',()=>{readColors();buildScene();buildField();updateLegend()});
frame();
